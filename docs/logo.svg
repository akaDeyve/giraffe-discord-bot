  <circle cx="73" cy="56" r="4.5" fill="#1E1F22"/>
  <circle cx="54.5" cy="52.5" r="1.4" fill="#fff"/>
  <circle cx="74.5" cy="54.5" r="1.4" fill="#fff"/>
