  <circle cx="72" cy="88" r="4" fill="#B5651D"/>
  <!-- ossicones -->
  <rect x="47" y="18" width="6" height="20" rx="3" fill="#B5651D"/>
  <rect x="73" y="18" width="6" height="20" rx="3" fill="#B5651D"/>
