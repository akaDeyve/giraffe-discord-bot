  <ellipse cx="36" cy="44" rx="11" ry="6" transform="rotate(-25 36 44)" fill="#F4B942"/>
  <ellipse cx="90" cy="44" rx="11" ry="6" transform="rotate(25 90 44)" fill="#F4B942"/>
